services:
  dvwa:
    image: ghcr.io/digininja/dvwa:latest
    container_name: microfinance-web
    ports:
      - "127.0.0.1:4280:80"
    environment:
      DB_SERVER: database
      DB_DATABASE: dvwa
      DB_USER: dvwa
      DB_PASSWORD: lab_password
    depends_on:
      - database

  database:
    image: mariadb:10
    container_name: microfinance-db
    environment:
      MYSQL_ROOT_PASSWORD: lab_root_password
      MYSQL_DATABASE: dvwa
      MYSQL_USER: dvwa
      MYSQL_PASSWORD: lab_password
    volumes:
      - db_data:/var/lib/mysql

volumes:
  db_data:
